<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <h1 class="game-title"> NEON SNAKE</h1>
        <div class="score-board">
            <div class="score-box">
                <span class="label">SCORE</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="score-box">
                <span class="label">HIGH SCORE</span>
                <span id="high-score" class="value">0</span>
            </div>
        </div>
        <canvas id="game-canvas" width="400" height="400"></canvas>
        <div class="mobile-controls">
            <div class="control-row">
                <button class="control-btn" id="btn-up">▲</button>
            </div>
            <div class="control-row">
                <button class="control-btn" id="btn-left">◀</button>
                <button class="control-btn" id="btn-down">▼</button>
                <button class="control-btn" id="btn-right">▶</button>
            </div>
        </div>
        <div id="game-over" class="overlay hidden">
            <div class="overlay-content">
                <h2>GAME OVER</h2>
                <p class="final-score">Score: <span id="final-score">0</span></p>
                <button id="restart-btn" class="restart-btn">PLAY AGAIN</button>
            </div>
        </div>
        <div id="start-screen" class="overlay">
            <div class="overlay-content">
                <h2>READY?</h2>
                <p class="instructions">Use arrow keys or buttons to move</p>
                <button id="start-btn" class="restart-btn">START GAME</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
